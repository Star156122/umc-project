[project]
name = "trading-project"
version = "0.1.0"
description = "Trading strategy backtest and report generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "openai>=2.0.0",
    "pandas>=2.2.0",
    "polars>=1.41.0",
    "polars-talib>=0.1.5",
    "python-dotenv>=1.2.2",
    "pymysql>=1.1.2",
    "scikit-learn>=1.6.0",
    "shioaji>=1.5.0",
    "torch>=2.7.0",
    "tsst>=0.8.7",
    "xgboost>=3.0.0",
]

[project.scripts]
trading-project = "main:main"
